<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Risk-Fast-Check | Versicherung</title>
    <link rel="stylesheet" href="assets/form.css?v=20260812a">
    <script defer src="assets/form.js?v=20260812a"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Gothic+A1:300,400,700|IBM+Plex+Sans:400|Raleway:200,400,500,700&display=swap">
  </head>
  <body class="rsc-quiz">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__logo-link" href="https://markusdan.com/">
          <img class="site-header__logo" src="https://markusdan.s3.amazonaws.com/hp/md-logo-transparent.png" alt="Markus Dan" width="250" height="63">
        </a>
      </div>
    </header>
    <main class="shell">
      <section class="card">
        <header class="hero">
          <div class="progress">
            <div class="progress-meta"><strong>Versicherung</strong><span>4 / 6</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 66.667%;"></div></div>
          </div>
        </header>
        <form data-step="4" novalidate>
          <div class="video-slot" data-video-slot></div>
          <fieldset class="choice-group" data-required-group="life_insurance_ownership" data-invalid="false">
            <legend>Besitzen Sie Lebensversicherungen als Rentenvorsorge (oder Bausparverträge)? <span class="req">*</span></legend>
            <div class="choices">
              <label class="choice"><input id="Field520" name="life_insurance_ownership" type="radio" value="Ja" data-group="life_insurance_ownership"><span>Ja</span></label>
              <label class="choice"><input id="Field521" name="life_insurance_ownership" type="radio" value="Nein" data-group="life_insurance_ownership"><span>Nein</span></label>
            </div>
            <div class="error">Bitte wählen Sie Ja oder Nein.</div>
          </fieldset>
          <fieldset class="choice-group">
            <legend>Wie viel zahlen Sie monatlich in diese Lebensversicherung/en ein?</legend>
            <div class="choices">
              <label class="choice"><input id="Field821" name="life_insurance_monthly_payment" type="radio" value="weniger als €100" data-group="life_insurance_monthly_payment"><span>weniger als €100</span></label>
              <label class="choice"><input id="Field822" name="life_insurance_monthly_payment" type="radio" value="€100 - €200" data-group="life_insurance_monthly_payment"><span>€100 - €200</span></label>
              <label class="choice"><input id="Field823" name="life_insurance_monthly_payment" type="radio" value="mehr als €200" data-group="life_insurance_monthly_payment"><span>mehr als €200</span></label>
              <label class="choice"><input id="Field824" name="life_insurance_monthly_payment" type="radio" value="ich weiß es nicht genau" data-group="life_insurance_monthly_payment"><span>ich weiß es nicht genau</span></label>
            </div>
          </fieldset>
          <div class="nav">
            <button class="link-button" type="button" data-prev="step-3.html">Vorherige Seite</button>
            <button class="button" type="submit" data-next="step-5.html">Weiter</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <a class="site-footer__logo-link" href="https://markusdan.com/">
            <img class="site-footer__logo" src="https://markusdan.s3.amazonaws.com/hp/md-logo-transparent.png" alt="Markus Dan" width="250" height="63">
          </a>
          <p class="site-footer__copyright">&copy; Markus Dan &ndash; Alle Rechte vorbehalten.</p>
        </div>
        <nav class="site-footer__nav" aria-label="Footer">
          <a href="step-1.html">START</a>
          <a href="https://markusdan.com/impressum/">IMPRESSUM</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
