<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Risk-Fast-Check | Immobilien</title>
    <link rel="stylesheet" href="assets/form.css?v=20260812a">
    <script defer src="assets/form.js?v=20260812a"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Gothic+A1:300,400,700|IBM+Plex+Sans:400|Raleway:200,400,500,700&display=swap">
  </head>
  <body class="rsc-quiz">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__logo-link" href="https://markusdan.com/">
          <img class="site-header__logo" src="https://markusdan.s3.amazonaws.com/hp/md-logo-transparent.png" alt="Markus Dan" width="250" height="63">
        </a>
      </div>
    </header>
    <main class="shell">
      <section class="card">
        <header class="hero">
          <div class="progress">
            <div class="progress-meta"><strong>Immobilien</strong><span>1 / 6</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 16.667%;"></div></div>
          </div>
        </header>
        <form data-step="1" novalidate>
          <div class="video-slot" data-video-slot></div>
          <fieldset class="choice-group" data-required-group="real_estate_ownership" data-invalid="false">
            <legend>Do you own real estate? Besitzen Sie Immobilien <span class="req">*</span></legend>
            <div class="choices">
              <label class="choice"><input id="Field214" name="real_estate_ownership" type="radio" value="Ja" data-group="real_estate_ownership"><span>Ja</span></label>
              <label class="choice"><input id="Field215" name="real_estate_ownership" type="radio" value="Nein" data-group="real_estate_ownership"><span>Nein</span></label>
            </div>
            <div class="error">Bitte wählen Sie Ja oder Nein.</div>
          </fieldset>
          <fieldset class="choice-group">
            <legend>Wie viel haben Sie in Immobilien investiert?</legend>
            <div class="choices">
              <label class="choice"><input id="Field112" name="real_estate_investment_amount" type="radio" value="weniger als €100.000" data-group="real_estate_investment_amount"><span>weniger als €100.000</span></label>
              <label class="choice"><input id="Field113" name="real_estate_investment_amount" type="radio" value="€100.000 - €500.000" data-group="real_estate_investment_amount"><span>€100.000 - €500.000</span></label>
              <label class="choice"><input id="Field114" name="real_estate_investment_amount" type="radio" value="€500.000 - €1.000.000" data-group="real_estate_investment_amount"><span>€500.000 - €1.000.000</span></label>
              <label class="choice"><input id="Field115" name="real_estate_investment_amount" type="radio" value="mehr als €1.000.000" data-group="real_estate_investment_amount"><span>mehr als €1.000.000</span></label>
            </div>
          </fieldset>
          <div class="nav nav-end">
            <button class="button" type="submit" data-next="step-2.html">Weiter</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <a class="site-footer__logo-link" href="https://markusdan.com/">
            <img class="site-footer__logo" src="https://markusdan.s3.amazonaws.com/hp/md-logo-transparent.png" alt="Markus Dan" width="250" height="63">
          </a>
          <p class="site-footer__copyright">&copy; Markus Dan &ndash; Alle Rechte vorbehalten.</p>
        </div>
        <nav class="site-footer__nav" aria-label="Footer">
          <a href="https://markusdan.com/">START</a>
          <a href="https://markusdan.com/agb/">AGB</a>
          <a href="https://markusdan.com/datenschutzerklaerung/">DATENSCHUTZERKLÄRUNG</a>
          <a href="https://markusdan.com/impressum/">IMPRESSUM</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
